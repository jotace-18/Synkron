name: synkron

services:
  sync:
    build:
      context: ./apps/sync
      target: runtime
    ports:
      - "127.0.0.1:3001:3000"
    init: true
    networks:
      - default
      - sync-data
    environment:
      PGHOST: sync-db
      PGPORT: "5432"
      PGDATABASE: ${SYNC_DB_NAME:?Falta SYNC_DB_NAME}
      PGUSER: ${SYNC_DB_USER:?Falta SYNC_DB_USER}
      PGPASSWORD: ${SYNC_DB_PASSWORD:?Falta SYNC_DB_PASSWORD}
      SYNC_AUTH_SERVICE_TOKEN: ${SYNC_AUTH_SERVICE_TOKEN:?Falta SYNC_AUTH_SERVICE_TOKEN}
      AUTH_API_INTERNAL_URL: http://api:3003
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-synkron_session}
      SYNC_CREDENTIALS_KEY: ${SYNC_CREDENTIALS_KEY:?Falta SYNC_CREDENTIALS_KEY}
      SYNC_ALLOWED_CONNECTION_ORIGINS: ${SYNC_ALLOWED_CONNECTION_ORIGINS:?Falta SYNC_ALLOWED_CONNECTION_ORIGINS}
    depends_on:
      sync-db:
        condition: service_healthy

  sync-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${SYNC_DB_NAME:?Falta SYNC_DB_NAME}
      POSTGRES_USER: ${SYNC_DB_ADMIN_USER:?Falta SYNC_DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${SYNC_DB_ADMIN_PASSWORD:?Falta SYNC_DB_ADMIN_PASSWORD}
      SYNC_DB_USER: ${SYNC_DB_USER:?Falta SYNC_DB_USER}
      SYNC_DB_PASSWORD: ${SYNC_DB_PASSWORD:?Falta SYNC_DB_PASSWORD}
    volumes:
      - sync-db-data:/var/lib/postgresql/data
      - ./infra/postgres/sync/01-create-app.sql:/docker-entrypoint-initdb.d/01-create-app.sql:ro
    networks:
      - sync-data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./apps/api
      target: runtime
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - default
      - api-data
    init: true
    environment:
      PGHOST: api-db
      PGPORT: "5432"
      PGDATABASE: ${API_DB_NAME:?Falta API_DB_NAME}
      PGUSER: ${API_DB_USER:?Falta API_DB_USER}
      PGPASSWORD: ${API_DB_PASSWORD:?Falta API_DB_PASSWORD}
      APP_ORIGIN: ${APP_ORIGIN:?Falta APP_ORIGIN}
      CSRF_SECRET: ${CSRF_SECRET:?Falta CSRF_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-synkron_session}
      SESSION_IDLE_TTL_MINUTES: ${SESSION_IDLE_TTL_MINUTES:-30}
      SESSION_ABSOLUTE_TTL_HOURS: ${SESSION_ABSOLUTE_TTL_HOURS:-12}
      AUTH_LOGIN_MAX_ATTEMPTS_PER_ACCOUNT: ${AUTH_LOGIN_MAX_ATTEMPTS_PER_ACCOUNT:-5}
      AUTH_LOGIN_MAX_ATTEMPTS_PER_IP: ${AUTH_LOGIN_MAX_ATTEMPTS_PER_IP:-30}
      AUTH_LOGIN_WINDOW_MINUTES: ${AUTH_LOGIN_WINDOW_MINUTES:-15}
      SYNC_AUTH_SERVICE_TOKEN: ${SYNC_AUTH_SERVICE_TOKEN:?Falta SYNC_AUTH_SERVICE_TOKEN}
    depends_on:
      api-db:
        condition: service_healthy


  api-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${API_DB_NAME:?Falta API_DB_NAME}
      POSTGRES_USER: ${API_DB_ADMIN_USER:?Falta API_DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${API_DB_ADMIN_PASSWORD:?Falta API_DB_ADMIN_PASSWORD}
      API_DB_USER: ${API_DB_USER:?Falta API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Falta API_DB_PASSWORD}
    volumes:
      - api-db-data:/var/lib/postgresql/data
      - ./infra/postgres/api/01-create-app.sql:/docker-entrypoint-initdb.d/01-create-app.sql:ro
    networks:
      - api-data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  task-api:
    build:
      context: ./fixtures/task-api
    init: true
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      TASK_API_TOKEN: ${TASK_API_TOKEN:?Falta TASK_API_TOKEN}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  academic:
    build:
      context: ./apps/academic
      target: runtime
    init: true
    ports:
      - "127.0.0.1:3101:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - default
      - academic-data
    environment:
      PGHOST: academic-db
      PGPORT: "5432"
      PGDATABASE: ${ACADEMIC_DB_NAME:?Falta ACADEMIC_DB_NAME}
      PGUSER: ${ACADEMIC_DB_USER:?Falta ACADEMIC_DB_USER}
      PGPASSWORD: ${ACADEMIC_DB_PASSWORD:?Falta ACADEMIC_DB_PASSWORD}
    depends_on:
      academic-db:
        condition: service_healthy

  academic-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${ACADEMIC_DB_NAME:?Falta ACADEMIC_DB_NAME}
      POSTGRES_USER: ${ACADEMIC_DB_ADMIN_USER:?Falta ACADEMIC_DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${ACADEMIC_DB_ADMIN_PASSWORD:?Falta ACADEMIC_DB_ADMIN_PASSWORD}
      ACADEMIC_DB_USER: ${ACADEMIC_DB_USER:?Falta ACADEMIC_DB_USER}
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:?Falta ACADEMIC_DB_PASSWORD}
    volumes:
      - academic-db-data:/var/lib/postgresql/data
      - ./infra/postgres/academic/01-create-app.sql:/docker-entrypoint-initdb.d/01-create-app.sql:ro
    networks:
      - academic-data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  sync-db-data:
  api-db-data:
  academic-db-data:

networks:
  default:
  sync-data:
    internal: true
  api-data:
    internal: true
  academic-data:
    internal: true
