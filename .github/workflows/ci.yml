          PGPASSWORD: ci-only-password

  personal:
    name: Comprobar Otros
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: personal_test
          POSTGRES_USER: personal_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U personal_test -d personal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/personal

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/personal/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npx --no-install prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Comprobar lint
