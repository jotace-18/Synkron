name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    name: Comprobar Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: sync_test
          POSTGRES_USER: sync_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U sync_test -d sync_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/sync

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/sync/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npx --no-install prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Comprobar lint
        run: npx --no-install eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Compilar
        run: npm run build

      - name: Ejecutar pruebas unitarias
        run: npm test -- --runInBand

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e -- --runInBand
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: sync_test
          PGUSER: sync_test
          PGPASSWORD: ci-only-password

  api:
    name: Comprobar API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npx --no-install prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Comprobar lint
        run: npx --no-install eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Compilar
        run: npm run build

      - name: Ejecutar pruebas unitarias
        run: npm test -- --runInBand

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e -- --runInBand

  docker:
    name: Comprobar imagen de Sync
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Revisar Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/sync/Dockerfile

      - name: Construir imagen
        run: docker build -t synkron-sync:ci apps/sync
