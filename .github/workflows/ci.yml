          PGDATABASE: personal_test
          PGUSER: personal_test
          PGPASSWORD: ci-only-password

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e -- --runInBand
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: personal_test
          PGUSER: personal_test
          PGPASSWORD: ci-only-password

  supporting-services:
    name: Comprobar ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        app: [monitoring, automation]

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: ${{ matrix.app }}_test
      PGUSER: ci_test
      PGPASSWORD: ci-only-password

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: ${{ matrix.app }}_test
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci_test -d ${{ matrix.app }}_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npx --no-install prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Comprobar lint
        run: npx --no-install eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Compilar
        run: npm run build

      - name: Ejecutar pruebas unitarias
        run: npm test -- --runInBand

      - name: Aplicar migraciones
        run: npm run migrate:up -- --create-schema

      - name: Ejecutar pruebas de integración con PostgreSQL
        run: npm run test:e2e -- --runInBand

  web:
    name: Comprobar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar lint
        run: npm run lint -- --max-warnings=0

      - name: Compilar
        run: npm run build

      - name: Ejecutar pruebas del cliente web
        run: npm test

  academic-web:
    name: Comprobar Campus
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/academic-web

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
